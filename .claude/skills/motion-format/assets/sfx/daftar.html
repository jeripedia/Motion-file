</style><main><h1>Bonus Sound Effect Motion Format</h1><p>34 efek suara · klik untuk mendengar · file ada di folder WAV/ dan MP3/</p><h2>01 Whoosh & Transisi</h2><button data-src="MP3/01%20Whoosh%20%26%20Transisi/whoosh-cepat.mp3"><b>▶</b><span><strong>whoosh-cepat</strong><small>Lewat cepat kiri ke kanan. Pergantian teks atau gambar.</small></span><em>0.4 dtk</em></button><button data-src="MP3/01%20Whoosh%20%26%20Transisi/whoosh-berat.mp3"><b>▶</b><span><strong>whoosh-berat</strong><small>Benda besar lewat, berat dan dalam. Transisi antar-adegan.</small></span><em>1.5 dtk</em></button><button data-src="MP3/01%20Whoosh%20%26%20Transisi/swoosh-naik.mp3"><b>▶</b><span><strong>swoosh-naik</strong><small>Desis naik lalu putus. Elemen terbang masuk.</small></span><em>0.5 dtk</em></button><button data-src="MP3/01%20Whoosh%20%26%20Transisi/swoosh-turun.mp3"><b>▶</b><span><strong>swoosh-turun</strong><small>Desis turun dan menghilang. Elemen keluar layar.</small></span><em>0.5 dtk</em></button><button data-src="MP3/01%20Whoosh%20%26%20Transisi/swish-tipis.mp3"><b>▶</b><span><strong>swish-tipis</strong><small>Sapuan halus dan singkat. Geser kartu, ikon, teks kecil.</small></span><em>0.2 dtk</em></button><button data-src="MP3/01%20Whoosh%20%26%20Transisi/whoosh-panjang.mp3"><b>▶</b><span><strong>whoosh-panjang</strong><small>Angin panjang bergetar. Pembuka atau perpindahan bab.</small></span><em>2.5 dtk</em></button><h2>02 Klik & UI</h2><button data-src="MP3/02%20Klik%20%26%20UI/klik-lembut.mp3"><b>▶</b><span><strong>klik-lembut</strong><small>Klik halus. Tombol ditekan, kursor mengetuk.</small></span><em>0.1 dtk</em></button><button data-src="MP3/02%20Klik%20%26%20UI/klik-keyboard.mp3"><b>▶</b><span><strong>klik-keyboard</strong><small>Satu tombol keyboard mekanik (tekan + lepas).</small></span><em>0.1 dtk</em></button><button data-src="MP3/02%20Klik%20%26%20UI/toggle-on.mp3"><b>▶</b><span><strong>toggle-on</strong><small>Saklar menyala: dua nada naik.</small></span><em>0.2 dtk</em></button><button data-src="MP3/02%20Klik%20%26%20UI/toggle-off.mp3"><b>▶</b><span><strong>toggle-off</strong><small>Saklar mati: dua nada turun.</small></span><em>0.2 dtk</em></button><button data-src="MP3/02%20Klik%20%26%20UI/tick-hover.mp3"><b>▶</b><span><strong>tick-hover</strong><small>Detik sangat kecil. Kursor melintas di atas tombol atau menu.</small></span><em>0.0 dtk</em></button><h2>03 Pop & Notifikasi</h2><button data-src="MP3/03%20Pop%20%26%20Notifikasi/pop-gelembung.mp3"><b>▶</b><span><strong>pop-gelembung</strong><small>Gelembung pecah, nada naik. Stiker atau emoji muncul.</small></span><em>0.1 dtk</em></button><button data-src="MP3/03%20Pop%20%26%20Notifikasi/pop-ganda.mp3"><b>▶</b><span><strong>pop-ganda</strong><small>Dua pop berturut. Dua elemen muncul bergantian.</small></span><em>0.3 dtk</em></button><button data-src="MP3/03%20Pop%20%26%20Notifikasi/notif-chat.mp3"><b>▶</b><span><strong>notif-chat</strong><small>Bunyi pesan masuk. Tampilan chat atau komentar.</small></span><em>0.9 dtk</em></button><button data-src="MP3/03%20Pop%20%26%20Notifikasi/notif-sukses.mp3"><b>▶</b><span><strong>notif-sukses</strong><small>Arpeggio naik ceria. Berhasil, centang, angka tercapai.</small></span><em>1.5 dtk</em></button><button data-src="MP3/03%20Pop%20%26%20Notifikasi/notif-gagal.mp3"><b>▶</b><span><strong>notif-gagal</strong><small>Dua nada rendah turun. Salah, gagal, ditolak.</small></span><em>0.3 dtk</em></button><h2>04 Impact & Hit</h2><button data-src="MP3/04%20Impact%20%26%20Hit/impact-sinematik.mp3"><b>▶</b><span><strong>impact-sinematik</strong><small>Dentuman besar ala trailer. Judul muncul, momen penting.</small></span><em>3.0 dtk</em></button><button data-src="MP3/04%20Impact%20%26%20Hit/hit-pukulan.mp3"><b>▶</b><span><strong>hit-pukulan</strong><small>Pukulan padat dan singkat. Teks dihentak, angka besar.</small></span><em>0.3 dtk</em></button><button data-src="MP3/04%20Impact%20%26%20Hit/dentum.mp3"><b>▶</b><span><strong>dentum</strong><small>Debam lembut dan rendah. Benda mendarat, kotak jatuh.</small></span><em>0.5 dtk</em></button><button data-src="MP3/04%20Impact%20%26%20Hit/dentang-logam.mp3"><b>▶</b><span><strong>dentang-logam</strong><small>Benturan logam berdenting. Kunci, gembok, besi.</small></span><em>1.6 dtk</em></button><h2>05 Riser & Drop</h2><button data-src="MP3/05%20Riser%20%26%20Drop/riser-panjang.mp3"><b>▶</b><span><strong>riser-panjang</strong><small>Tegangan naik 3 detik lalu putus. Sebelum reveal besar.</small></span><em>3.1 dtk</em></button><button data-src="MP3/05%20Riser%20%26%20Drop/riser-nada.mp3"><b>▶</b><span><strong>riser-nada</strong><small>Nada synth naik makin cepat. Hitung mundur, menuju klimaks.</small></span><em>2.8 dtk</em></button><button data-src="MP3/05%20Riser%20%26%20Drop/drop-sub.mp3"><b>▶</b><span><strong>drop-sub</strong><small>Bass jatuh dalam. Setelah riser, saat logo atau judul mendarat.</small></span><em>1.1 dtk</em></button><button data-src="MP3/05%20Riser%20%26%20Drop/reverse-swell.mp3"><b>▶</b><span><strong>reverse-swell</strong><small>Suara terbalik yang membengkak. Masuk ke adegan dramatis.</small></span><em>2.0 dtk</em></button><h2>06 Glitch & Digital</h2><button data-src="MP3/06%20Glitch%20%26%20Digital/glitch-pendek.mp3"><b>▶</b><span><strong>glitch-pendek</strong><small>Gangguan digital singkat. Teks rusak, layar berkedip.</small></span><em>0.3 dtk</em></button><button data-src="MP3/06%20Glitch%20%26%20Digital/glitch-panjang.mp3"><b>▶</b><span><strong>glitch-panjang</strong><small>Gangguan digital lebih panjang dengan stutter. Transisi glitch.</small></span><em>0.9 dtk</em></button><button data-src="MP3/06%20Glitch%20%26%20Digital/data-blip.mp3"><b>▶</b><span><strong>data-blip</strong><small>Rentetan bip komputer. Memproses data, loading, AI berpikir.</small></span><em>0.7 dtk</em></button><button data-src="MP3/06%20Glitch%20%26%20Digital/zap-laser.mp3"><b>▶</b><span><strong>zap-laser</strong><small>Tembakan laser fiksi ilmiah. Efek energi at
